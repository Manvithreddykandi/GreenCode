<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Green Code Energy Optimizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e1e; color: #d4d4d4; padding: 20px; }
        .container { display: flex; gap: 20px; height: 40vh; }
        .editor-box { flex: 1; display: flex; flex-direction: column; }
        textarea { flex: 1; background-color: #2d2d2d; color: #569cd6; border: 1px solid #444; padding: 15px; font-family: monospace; border-radius: 5px; }
        .controls { text-align: center; margin: 20px 0; }
        button { padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; margin: 0 10px; transition: 0.3s; }
        #analyzeBtn { background-color: #2196F3; color: white; }
        #optimizeBtn { background-color: #4CAF50; color: white; display: none; }
        #downloadBtn { background-color: #ff9800; color: white; display: none; }
        .charts-container { display: flex; justify-content: space-around; margin-top: 30px; flex-wrap: wrap; }
        .chart-wrapper { width: 45%; background: #2d2d2d; padding: 15px; border-radius: 10px; }
        h3 { color: #4CAF50; text-align: center; }
        #reportContainer { padding: 20px; background-color: #1e1e1e; border-radius: 10px; }
        
        /* New Styles for the Complexity Board */
        .complexity-board { display: none; justify-content: space-around; background: #2d2d2d; padding: 20px; border-radius: 10px; margin-top: 20px; border-left: 5px solid #2196F3; }
        .complexity-col { text-align: center; width: 45%; }
        .complexity-val { color: #fff; font-size: 1.4em; font-family: monospace; background: #1e1e1e; padding: 5px 15px; border-radius: 5px; display: inline-block; margin: 5px 0; }
    </style>
</head>
<body>

    <h1>🌱 GenAI Green Code Optimizer</h1>
    
    <div style="text-align: center; margin-bottom: 15px; font-family: monospace;">
        <span style="background-color: #333; padding: 8px 15px; border-radius: 20px; color: #aaa; border: 1px solid #444;">
            💻 Hardware Detected: <strong id="cpuNameDisplay" style="color: #00BCD4;">Waiting for Analysis...</strong>
        </span>
    </div>

    
    <div class="controls">
        <button id="analyzeBtn" onclick="analyzeCode()">1. Analyze Code</button>
        <button id="optimizeBtn" onclick="optimizeCode()">2. Optimize & Compare</button>
        <button id="downloadBtn" onclick="downloadPDF()">3. Download PDF Report</button>
    </div>

    <div id="reportContainer">
        <div class="container">
            <div class="editor-box">
                <h3>Original Code</h3>
                <textarea id="inputCode" placeholder="Paste Java code..."></textarea>
            </div>
            <div class="editor-box">
                <h3>Optimized Code</h3>
                <textarea id="outputCode" readonly placeholder="Optimized code will appear here..."></textarea>
            </div>
        </div>

        <div class="complexity-board" id="complexityBoard">
            <div class="complexity-col">
                <h4 style="color: #f44336; margin: 0 0 10px 0;">Original Complexity</h4>
                <div>Time: <span class="complexity-val" id="origTimeO">--</span></div>
                <div>Space: <span class="complexity-val" id="origSpaceO">--</span></div>
            </div>
            <div class="complexity-col">
                <h4 style="color: #4CAF50; margin: 0 0 10px 0;">Optimized Complexity</h4>
                <div>Time: <span class="complexity-val" id="optTimeO">--</span></div>
                <div>Space: <span class="complexity-val" id="optSpaceO">--</span></div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-wrapper"><canvas id="timeChart"></canvas></div>
            <div class="chart-wrapper"><canvas id="energyChart"></canvas></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
